name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -B -m pytest

      - name: Build QGIS plugin archive
        run: python scripts/package_plugin.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vscode-georamp/package-lock.json

      - name: Install VS Code extension dependencies
        working-directory: vscode-georamp
        run: npm ci

      - name: Test VS Code extension
        working-directory: vscode-georamp
        run: npm test

      - name: Type-check VS Code extension
        working-directory: vscode-georamp
        run: npm run typecheck

      - name: Build and validate VS Code extension
        working-directory: vscode-georamp
        run: npm run build && npm run check:webview

      - name: Upload plugin archive
        uses: actions/upload-artifact@v4
        with:
          name: georamp
          path: dist/georamp-*.zip
